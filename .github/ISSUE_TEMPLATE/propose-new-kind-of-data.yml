name: Propose a new kind of data
description: Propose a new kind of data (a modality) that PRISM does not know yet, for example skin temperature from a wrist sensor
title: "[New kind of data]: "
labels: ["type: new-kind-of-data", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a new kind of data!

        Describe the data and paste a small made-up sample file. A maintainer adds the new kind of
        data (schema, file-name entry and specification page). PRISM validates such files only once
        the addition is merged and part of a PRISM release.

        Paste the sample as text below; attachments are not read.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is measured, with which device or method, and how the files are organised.
    validations:
      required: true

  - type: input
    id: closest_kind
    attributes:
      label: Closest kind of data
      description: Optional. The existing kind of data that is most similar, if you know one.
    validations:
      required: false

  - type: textarea
    id: sample
    attributes:
      label: Sample file
      description: A small made-up example file (at most 50,000 bytes), pasted as text.
      render: text
    validations:
      required: true

  - type: checkboxes
    id: agreements
    attributes:
      label: Agreements
      options:
        - label: I agree that my contribution is licensed as stated in LICENSE (CC BY 4.0 for the specification).
          required: true
        - label: The sample is made up and contains no real participant data.
          required: true
